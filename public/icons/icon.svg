<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Flask body -->
  <!-- Neck of flask -->
  <rect x="210" y="96" width="92" height="120" rx="12" fill="white" opacity="0.95"/>

  <!-- Flask wide body -->
  <path d="M168 216 L210 216 L210 288 L96 400 Q88 420 104 436 Q116 448 136 448 L376 448 Q396 448 408 436 Q424 420 416 400 L302 288 L302 216 L344 216 L344 200 L168 200 Z"
        fill="white" opacity="0.95"/>

  <!-- Flask liquid -->
  <path d="M140 390 Q132 410 148 424 Q160 436 180 436 L332 436 Q352 436 364 424 Q380 410 372 390 L280 295 L280 288 L232 288 L232 295 Z"
        fill="#60a5fa" opacity="0.85"/>

  <!-- Bubbles in liquid -->
  <circle cx="196" cy="408" r="12" fill="white" opacity="0.5"/>
  <circle cx="240" cy="420" r="8" fill="white" opacity="0.4"/>
  <circle cx="300" cy="412" r="10" fill="white" opacity="0.45"/>
  <circle cx="340" cy="400" r="6" fill="white" opacity="0.35"/>

  <!-- Flask top opening line -->
  <rect x="200" y="192" width="112" height="16" rx="8" fill="#93c5fd" opacity="0.7"/>

  <!-- Cross mark (medical) in top right -->
  <rect x="354" y="94" width="18" height="56" rx="9" fill="white" opacity="0.9"/>
  <rect x="335" y="113" width="56" height="18" rx="9" fill="white" opacity="0.9"/>
</svg>
